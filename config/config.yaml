output_dir: "kraken"
input_dir: "metagenome/dehost"
ref_dir: "data/data_bact/genome"
taxid: "bact"
sample_name: "gallus_sample"

sra:
  sra_id:
  # as example
    - "SRR8265535"


  paired: True
  thread: 2

threads:
  bwa_index: 2
  bwa_align: 2
  sam_to_bam: 2
  split_reads: 2

# transcriptome params
#==================

kallisto:
  kmer_size: 31  # k-mer length (default is 31)
  bootstrap: 30  # Number of bootstrap replicates for uncertainty estimation

# host_genome params
#==========================

threads:
  bwa_index: 8
  bwa_align: 8
  sam_to_bam: 8  
  split_reads: 4    


#kraken2 params
#============================

algorithm: "kraken2"  # Algorithm to be used  
database: "/mnt/metagenomics/kraken2"  # Path to the Kraken2 database  
sample_name: "gallus_gallus"  # Sample name (used for naming output files) 

#============================

# bracken params
read_length: 150
taxonomic_level: ['S']


# preprocessing params
#=================
##### params for specific rules ####
fastp:
    thread: 8
    qualified_quality_phred: 20
    min_length: 50
    detect_adapters: True

# metaphlan params
#===============================

metaphlan:
  threads: 8

# humann params
#===============================
humann:
  threads: 8



metatranscriptome:
  sra:
    sra_id:
    - "SRR33636168"
